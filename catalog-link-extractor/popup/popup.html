<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Catalog Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <div>
          <h1>Catalog Link Extractor</h1>
          <span class="badge">v1.0 JSON Database</span>
        </div>
      </div>
      <p class="subtitle">Ekstrak otomatis seluruh link preview, nama tema, dan cover dari halaman katalog.</p>
    </header>

    <!-- Scan Action Box -->
    <div class="scan-box">
      <button id="btnScan" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Pindai Halaman Ini</span>
      </button>
    </div>

    <!-- Results Overview -->
    <div id="resultBox" class="result-box" style="display: none;">
      <div class="result-header">
        <span class="result-title">Hasil Pemindaian</span>
        <span class="count-badge" id="countBadge">0 Template</span>
      </div>

      <!-- Quick Action Buttons -->
      <div class="actions-grid">
        <button id="btnCopyUrls" class="btn btn-action">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Salin Link URL</span>
        </button>
        <button id="btnDownloadJson" class="btn btn-action btn-json">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Export JSON</span>
        </button>
        <button id="btnDownloadTxt" class="btn btn-action">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span>Export TXT</span>
        </button>
      </div>

      <!-- Preview List Container -->
      <div class="items-list" id="itemsList"></div>
    </div>

    <!-- Status / Toast Message -->
    <div id="statusMsg" class="status-msg" style="display: none;"></div>

    <!-- Footer -->
    <footer class="footer">
      <span>Siap disalin ke <b>Scraper Web Wedding Batch</b></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
